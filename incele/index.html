<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambar İnceleme</title>
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#f3f7fb; --kart:#fff; --kenar:#dbe4ee; --kenar2:#e9eef4; --yazi:#1f2a37; --soluk:#6b7a8c;
  --mavi:#1677d2; --mavi2:#0b5fae; --mavi-acik:#e8f2fc; --yesil:#22a35a; --kirmizi:#e5484d; --turuncu:#f59e0b;
  --marka:#b45309; --golge:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--yazi);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--mavi);text-decoration:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- sekme çubuğu */
.ust{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--kenar);height:34px;flex:none}
.sekmeler{display:flex;overflow-x:auto;flex:1;min-width:0}
.sekme{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-right:1px solid var(--kenar2);white-space:nowrap;
  color:var(--soluk);cursor:pointer;max-width:240px;font-size:12.5px;position:relative}
.sekme span{overflow:hidden;text-overflow:ellipsis}
.sekme.aktif{color:var(--yazi);background:var(--bg)}
.sekme.aktif::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--mavi)}
.sekme .kapat{border:0;background:none;color:var(--soluk);padding:2px;border-radius:3px;line-height:0}
.sekme .kapat:hover{background:var(--kenar2);color:var(--yazi)}
.sekme svg.i{font-size:15px}
.marka{display:flex;align-items:center;gap:8px;padding:0 12px;border-left:1px solid var(--kenar2);font-weight:600;color:var(--marka)}
.marka img{width:20px;height:20px}
.marka button{border:0;background:none;color:var(--soluk);font-weight:400;padding:4px 6px;border-radius:4px}
.marka button:hover{background:var(--kenar2);color:var(--yazi)}

main{flex:1;overflow:auto;min-height:0}
.sayfa{padding:14px 18px 40px}
.kirinti{display:flex;align-items:center;gap:8px;font-size:17px;margin:2px 0 12px;color:var(--yazi)}
.kirinti .ok{color:var(--soluk)}
.kirinti .sag{margin-left:auto;display:flex;gap:6px}

/* ---- kartlar */
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:2px;margin-bottom:14px;box-shadow:var(--golge)}
.sekmeli-baslik{display:flex;align-items:center;gap:22px;padding:0 14px;border-bottom:1px solid var(--kenar2);height:42px}
.sekmeli-baslik .ac{border:0;background:none;color:var(--mavi);padding:0;line-height:0}
.sekmeli-baslik .t{border:0;background:none;font-size:15px;color:var(--yazi);padding:10px 0;border-bottom:2px solid transparent}
.sekmeli-baslik .t.aktif{color:var(--mavi);border-bottom-color:var(--mavi)}
.sekmeli-baslik .sag{margin-left:auto;color:var(--mavi)}
.kart-govde{padding:12px 16px}

.bolum-baslik{display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-bottom:1px solid var(--kenar2);cursor:pointer;user-select:none}
.bolum-baslik .ad{font-size:16px;color:var(--mavi);border-bottom:2px solid var(--mavi);padding:9px 0}
.bolum-baslik .say{color:var(--yesil);font-size:15px}
.bolum-baslik svg{color:var(--mavi);transition:transform .15s}
.kapali .bolum-baslik svg{transform:rotate(-90deg)}
.kapali .doseme-izgara{display:none}

/* ---- döşemeler */
.doseme-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:4px 10px;padding:14px 16px 16px}
.doseme{display:flex;align-items:flex-start;gap:10px;padding:8px 8px;border-radius:4px;cursor:pointer;border:1px solid transparent;min-width:0}
.doseme:hover{background:var(--mavi-acik);border-color:#cfe3f7}
.doseme .ikon{width:36px;height:36px;display:grid;place-items:center;color:var(--mavi);font-size:34px;flex:none}
.doseme .ikon.app{border-radius:8px;font-size:20px;color:#fff;font-weight:700;position:relative;overflow:hidden}
.ikon.app img.simge{position:absolute;inset:0;width:100%;height:100%;background:#fff;object-fit:contain}
.app-ad{display:flex;align-items:center;gap:8px}.app-ad img{width:22px;height:22px;border-radius:5px;flex:none}
.app-ad .harf{width:22px;height:22px;border-radius:5px;flex:none;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.doseme .ad{font-size:13px;color:var(--yazi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doseme .say{font-size:12px;color:var(--soluk)}
.doseme.bos{opacity:.5}
.doseme .metin{min-width:0;padding-top:1px}
.nokta{display:inline-block;width:7px;height:9px;border:1.5px solid var(--yesil);border-radius:1px;margin-left:5px;vertical-align:1px}

/* ---- bilgi ağacı */
.agac{display:grid;grid-template-columns:1fr 1fr;gap:4px 40px}
.agac .grup{margin-bottom:6px}
.agac .gb{display:flex;align-items:center;gap:6px;font-weight:700;padding:3px 0;cursor:pointer}
.agac .gb svg{color:var(--mavi)}
.agac .alt{padding-left:16px}
.agac .alt .gb{font-weight:700}
.agac table{border-collapse:collapse;margin-left:16px}
.agac td{padding:2px 14px 2px 18px;vertical-align:top}
.agac td:first-child{color:var(--soluk);white-space:nowrap;width:180px}
.agac td.kaynak{color:var(--mavi);white-space:nowrap}
.agac .kapali>table,.agac .kapali>.alt{display:none}
.agac .kapali>.gb svg{transform:rotate(-90deg)}
@media (max-width:900px){.agac{grid-template-columns:1fr}}

.ozet-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ozet-kutu{border:1px solid var(--kenar2);border-radius:4px;padding:10px 12px}
.ozet-kutu b{display:block;font-size:20px;font-weight:600;color:var(--mavi2)}
.ozet-kutu span{color:var(--soluk);font-size:12px}

/* ---- tablolar */
.arac{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--kenar2);flex-wrap:wrap}
.arac h2{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.arac h2 .say{color:var(--soluk);font-weight:400;font-size:13px}
.arac .bosluk{flex:1}
.ara-kutu{display:flex;align-items:center;gap:6px;border:1px solid var(--kenar);border-radius:4px;padding:0 8px;background:#fff;height:30px;min-width:240px}
.ara-kutu input{border:0;outline:0;flex:1;height:28px;background:none}
.ara-kutu svg{color:var(--soluk)}
select{height:30px;border:1px solid var(--kenar);border-radius:4px;background:#fff;padding:0 6px}
.dugme{height:30px;border:1px solid var(--kenar);border-radius:4px;background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;color:var(--yazi)}
.dugme:hover{border-color:var(--mavi);color:var(--mavi)}
.dugme.ana{background:var(--mavi);border-color:var(--mavi);color:#fff}
.dugme.ana:hover{background:var(--mavi2)}
.dugme:disabled{opacity:.5;cursor:default}

.duzen{display:flex;min-height:0;height:calc(100vh - 34px - 112px)}
.tablo-alan{flex:1;overflow:auto;min-width:0}
table.veri{border-collapse:collapse;width:100%;font-size:12.5px}
table.veri th{position:sticky;top:0;background:#f7fafd;text-align:left;font-weight:600;color:#3d4b5c;padding:7px 10px;
  border-bottom:1px solid var(--kenar);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.veri th .ok{color:var(--mavi);font-size:10px;margin-left:4px}
table.veri td{padding:6px 10px;border-bottom:1px solid var(--kenar2);vertical-align:top;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.veri td.uzun{white-space:normal;min-width:280px}
table.veri td.uzun div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.veri tr{cursor:pointer}
table.veri tbody tr:hover{background:#f5f9fe}
table.veri tr.secili{background:var(--mavi-acik)}
td.yildiz{width:26px;color:var(--turuncu);text-align:center;padding-right:0}
.rozet{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#eef2f6;color:#3d4b5c}
.rozet.Gelen{background:#e7f6ec;color:#17803d}.rozet.Giden{background:#e8f2fc;color:#0b5fae}
.rozet.Cevapsız,.rozet.Reddedilen,.rozet.Engellenen,.rozet.Gönderilemedi{background:#fdecec;color:#c62828}
.rozet.SMS{background:#eef0ff;color:#4338ca}.rozet.MMS{background:#f6ecff;color:#7e22ce}
.dosya-ad{display:flex;align-items:center;gap:6px}
.dosya-ad img{width:28px;height:28px;object-fit:cover;border-radius:3px;background:#eef2f6;flex:none}
.sayfalama{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--kenar2);color:var(--soluk);background:#fff}
.bos-durum{padding:50px 20px;text-align:center;color:var(--soluk)}
.bos-durum svg{font-size:42px;color:#b9c6d4;display:block;margin:0 auto 10px}

/* ---- ayrıntı paneli */
.ayrinti{width:380px;border-left:1px solid var(--kenar);overflow:auto;background:#fff;flex:none}
.ayrinti .ust-b{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--kenar2);font-weight:600}
.ayrinti .ust-b button{margin-left:auto}
.ayrinti dl{margin:0;padding:10px 14px;display:grid;grid-template-columns:110px 1fr;gap:6px 10px}
.ayrinti dt{color:var(--soluk)}
.ayrinti dd{margin:0;word-break:break-word;white-space:pre-wrap}
.onizleme{padding:10px 14px;border-bottom:1px solid var(--kenar2);text-align:center;background:#f7fafd}
.onizleme img,.onizleme video{max-width:100%;max-height:320px;border-radius:3px}
.onizleme audio{width:100%}
.etiket-alan{padding:10px 14px;border-top:1px solid var(--kenar2);display:grid;gap:8px}
.etiket-alan textarea{width:100%;min-height:60px;border:1px solid var(--kenar);border-radius:4px;padding:6px}

/* ---- galeri */
.galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:12px 14px}
.galeri .oge{position:relative;aspect-ratio:1;background:#e9eef4;border-radius:3px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.galeri .oge:hover{border-color:var(--mavi)}
.galeri img{width:100%;height:100%;object-fit:cover;display:block}
.galeri .vid{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.galeri .alt-yazi{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.galeri .yildiz{position:absolute;top:4px;right:6px;color:var(--turuncu);text-shadow:0 0 3px #000}
.isik{position:fixed;inset:0;background:rgba(10,15,25,.9);display:flex;z-index:50}
.isik .resim{flex:1;display:grid;place-items:center;padding:20px;min-width:0}
.isik .resim img,.isik .resim video{max-width:100%;max-height:calc(100vh - 40px)}
.isik .yan{width:360px;background:#fff;overflow:auto}
.isik .kapat-b{position:absolute;top:10px;left:14px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:4px;padding:6px 10px}
.isik .gez{position:absolute;top:50%;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:4px;padding:14px 10px;font-size:18px}

/* ---- zaman çizelgesi */
.zaman{padding:10px 18px}
.gun{font-weight:600;color:var(--mavi2);margin:14px 0 6px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:1}
.olay{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--kenar2);border-radius:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.olay:hover{border-color:#cfe3f7;background:#fbfdff}
.olay .saat{color:var(--soluk);width:58px;flex:none;font-variant-numeric:tabular-nums}
.olay .tikon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none}
.olay .tikon.cagri{background:#e7f6ec;color:#17803d}.olay .tikon.mesaj{background:#eef0ff;color:#4338ca}
.olay .tikon.not{background:#fff6e5;color:#b45309}.olay .tikon.medya{background:#e8f2fc;color:#0b5fae}
.olay .ic{min-width:0;flex:1}
.olay .ic .b{font-weight:600}
.olay .ic .m{color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.olay img{width:46px;height:46px;object-fit:cover;border-radius:3px}
.secenekler{display:flex;gap:12px;align-items:center}
.secenekler label{display:flex;gap:4px;align-items:center;cursor:pointer}

/* ---- istatistik */
.grafikler{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;padding:14px}
.grafik{background:#fff;border:1px solid var(--kenar);border-radius:3px;padding:12px 14px}
.grafik h3{margin:0 0 10px;font-size:14px;font-weight:600}
.cubuk{display:grid;grid-template-columns:150px 1fr 80px;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.cubuk .ad{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cubuk .bar{height:14px;background:#eef3f8;border-radius:2px;overflow:hidden}
.cubuk .bar i{display:block;height:100%;background:var(--mavi);border-radius:2px}
.cubuk .deger{text-align:right;color:var(--soluk);font-variant-numeric:tabular-nums}
.sutunlar{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px}
.sutunlar .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:10px;color:var(--soluk)}
.sutunlar .s i{width:100%;background:var(--mavi);border-radius:2px 2px 0 0;min-height:1px}
.sutunlar .s i.m{background:#8b5cf6}

/* ---- ana sayfa */
.cihaz-kartlari{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cihaz-kart{background:#fff;border:1px solid var(--kenar);border-radius:4px;padding:16px;cursor:pointer;display:flex;gap:14px}
.cihaz-kart:hover{border-color:var(--mavi);box-shadow:0 2px 10px rgba(22,119,210,.12)}
.cihaz-kart .tel{font-size:44px;color:var(--mavi)}
.cihaz-kart h3{margin:0 0 2px;font-size:16px}
.cihaz-kart .alt{color:var(--soluk)}
.cip{display:inline-block;background:var(--mavi-acik);color:var(--mavi2);border-radius:10px;padding:1px 8px;font-size:11.5px;margin:6px 4px 0 0}

.wa-hesap{border:1px solid var(--kenar);border-radius:4px;margin:12px 14px;background:#fff}
.wa-hesap h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--kenar2);font-size:14px;display:flex;align-items:center;gap:8px}
.wa-hesap .ic{display:grid;grid-template-columns:1fr 1fr;gap:0}
.wa-hesap .ic>div{padding:10px 14px}
.wa-hesap .ic>div+div{border-left:1px solid var(--kenar2)}
.uyari{margin:12px 14px;padding:10px 14px;border-left:4px solid var(--turuncu);background:#fff7ed;border-radius:3px}
.bilgi{margin:12px 14px;padding:10px 14px;border-left:4px solid var(--mavi);background:#eff6ff;border-radius:3px}

.yukleniyor{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px;color:var(--soluk)}
.donen{width:34px;height:34px;border:3px solid var(--kenar);border-top-color:var(--mavi);border-radius:50%;animation:don 0.8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;right:18px;background:#1f2a37;color:#fff;padding:10px 14px;border-radius:4px;z-index:60;opacity:0;transition:opacity .2s}
.toast.goster{opacity:1}
.not-alan textarea{width:100%;min-height:180px;border:1px solid var(--kenar);border-radius:4px;padding:10px}
.hakkinda{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:70}
.hakkinda>div{background:#fff;border-radius:6px;padding:26px 30px;width:420px;text-align:center}
.hakkinda img{width:72px}
.pencere>div{text-align:left;width:600px;max-width:calc(100vw - 32px)}
.pencere h2{margin:0 0 4px;font-size:18px}
.pencere .aciklama{color:var(--soluk);margin:0 0 16px}
.pencere label.b{display:block;font-weight:600;margin-bottom:4px}
.pencere input[type=text]{width:100%;height:32px;border:1px solid var(--kenar);border-radius:4px;padding:0 8px;margin-bottom:14px}
.pencere .secim{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--kenar2);border-radius:4px;margin-bottom:6px;cursor:pointer}
.pencere .secim:hover{border-color:#cfe3f7;background:#fbfdff}
.pencere .secim small{display:block;color:var(--soluk)}
.pencere .alt-d{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.ilerleme{height:6px;background:#eef3f8;border-radius:3px;overflow:hidden;margin-top:6px}
.ilerleme i{display:block;height:100%;width:0;background:var(--mavi);transition:width .3s}
/* ---- dışa aktarma sihirbazı */
.sih-arka{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:80}
.sih{background:#fff;width:min(1180px,calc(100vw - 24px));height:min(860px,calc(100vh - 24px));display:flex;flex-direction:column;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sih-ust{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:40px;background:#faf3f3;border-bottom:1px solid var(--kenar2);font-size:14px}
.sih-ust .kapat-x{margin-left:auto;border:0;background:none;padding:8px;color:var(--soluk);font-size:16px}
.sih-ust .kapat-x:hover{color:var(--yazi);background:var(--kenar2)}
.sih-govde{flex:1;display:flex;min-height:0}
.sih-nav{width:250px;border-right:1px solid var(--kenar);padding:4px 0;flex:none;overflow:auto}
.sih-nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;font-size:15px;color:var(--yazi);text-align:left}
.sih-nav button svg{font-size:22px;color:var(--mavi2)}
.sih-nav button:hover{background:var(--mavi-acik)}
.sih-nav button.aktif{background:#cfe3f7}
.sih-icerik{flex:1;overflow:auto;padding:22px 36px}
.sih-icerik h1{font-size:24px;font-weight:400;margin:0 0 6px}
.sih-icerik .ack{color:var(--soluk);font-size:14px;margin:0 0 18px}
.sih-iki{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kutu{border:1px solid var(--kenar);border-radius:2px;display:flex;flex-direction:column;min-height:0}
.kutu-b{padding:8px 10px;border-bottom:1px solid var(--kenar2);font-size:14px}
.kutu-b label{display:flex;gap:8px;align-items:center;cursor:pointer}
.kutu-i{height:330px;overflow:auto;padding:4px 0}
.sih .oge{display:flex;align-items:center;gap:9px;padding:4px 10px;cursor:pointer;font-size:14px}
.sih .oge:hover{background:#f5f9fe}
.sih .oge svg{font-size:19px;color:var(--mavi)}
.sih .oge .ad{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sih .oge .say{color:var(--yesil);font-variant-numeric:tabular-nums}
.sih .oge.g svg{color:var(--yazi);font-size:15px}
.sih .grup .alt{padding-left:24px;border-left:1px dotted var(--kenar);margin-left:16px}
.sih input[type=checkbox]{width:16px;height:16px;accent-color:var(--mavi2);flex:none}
.uik{width:20px;height:20px;border-radius:4px;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.sih-form{margin-top:18px;display:grid;gap:12px}
.sih-satir{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.sih .alan{display:flex;flex-direction:column;gap:4px;color:var(--soluk);font-size:14px}
.sih .alan input[type=text],.sih .alan input[type=datetime-local],.sih .alan select,.sih .alan textarea{border:0;border-bottom:1px solid #b8c4d2;
  font-size:15px;color:var(--yazi);padding:5px 4px;background:none;border-radius:0;height:auto;outline:0}
.sih .alan textarea{border:1px solid #b8c4d2;border-radius:3px;resize:vertical}

<script>
"use strict";
// ======================================================================= yardımcılar
const $ = (s, k = document) => k.querySelector(s);
const esc = s => s == null ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = (d) => d.join("");
const IK = {

  not:'<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M9 12h6M9 16h4"/>',

  oynat:'<path d="M8 5v14l11-7z" fill="currentColor"/>',
  yenile:'<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/>',
  indir:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  ayar:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 010-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 014 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
};
const ik = (ad, ek = "") => `<svg class="i ${ek}" viewBox="0 0 24 24">${IK[ad] || ""}</svg>`;

async function api(yol, govde) {
  const r = await fetch(yol, govde ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(govde)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.hata || r.statusText);
  return j;
}
const qs = o => Object.entries(o).filter(([, v]) => v !== "" && v != null).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
const iki = n => String(n).padStart(2, "0");
function tarih(ms, saniye = true) {
  if (ms == null || ms === "") return "";
  const d = new Date(+ms);
  if (isNaN(d)) return "";
  return `${iki(d.getDate())}.${iki(d.getMonth() + 1)}.${d.getFullYear()} ${iki(d.getHours())}:${iki(d.getMinutes())}${saniye ? ":" + iki(d.getSeconds()) : ""}`;
}
// Android ön yüklü uygulamalar için 1970 bildirir; dizinde 0 olarak saklanır
const kurulum = (ms, alan) => ms === 0 ? (alan === "ilk_yukleme" ? "Ön yüklü (tarih yok)" : "Güncellenmedi (fabrika sürümü)") : tarih(ms, false);
const gunAdi = ms => new Date(+ms).toLocaleDateString("tr-TR", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
function sure(s) { s = +s || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + iki(m) : m) + ":" + iki(s % 60); }
function boyut(n) { n = +n || 0; const b = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + b[i]; }
const sayi = n => (+n || 0).toLocaleString("tr-TR");
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("goster"); clearTimeout(t._z); t._z = setTimeout(() => t.classList.remove("goster"), 2200); }
const dosyaUrl = (cid, c, yol, indir) => `/dosya?${qs({cihaz: cid, c, yol, indir: indir ? 1 : ""})}`;
const PDF = /\.pdf$/i, METIN = /\.(txt|log|csv|json|xml|html?|md|ini|cfg|conf|vcf|ics|js|css|properties|srt|nomedia)$/i;
const RESIM = /\.(jpe?g|png|gif|webp|bmp)$/i, VIDEO = /\.(mp4|webm|3gp|mkv|mov|m4v)$/i, SES = /\.(mp3|m4a|aac|opus|ogg|wav|amr|flac)$/i;

// ======================================================================= durum ve sekmeler
const D = {cihazlar: [], kok: "", sekmeler: [], aktif: null, ozet: {}};
function sekmeAc(s) {
  const varolan = D.sekmeler.find(x => x.anahtar === s.anahtar);
  if (varolan) { D.aktif = varolan.anahtar; Object.assign(varolan, s.guncelle ? s : {}); }
  else { D.sekmeler.push(s); D.aktif = s.anahtar; }
  ciz();
}
function sekmeKapat(a, e) {
  e && e.stopPropagation();
  const i = D.sekmeler.findIndex(x => x.anahtar === a);
  if (i < 0 || D.sekmeler[i].sabit) return;
  D.sekmeler.splice(i, 1);
  if (D.aktif === a) D.aktif = (D.sekmeler[i] || D.sekmeler[i - 1] || D.sekmeler[0]).anahtar;
  ciz();
}
// Sekme anahtarı JSON filtre içerebilir ({"uygulama":"..."}); onclick içine gömülmez, data-a'dan okunur.
function sekmeSec(a) { D.aktif = a; ciz(); }
function sekmeleriCiz() {
  $("#sekmeler").innerHTML = D.sekmeler.map(s => `
    <div class="sekme ${s.anahtar === D.aktif ? "aktif" : ""}" data-a="${esc(s.anahtar)}" onclick="sekmeSec(this.dataset.a)"
      onauxclick="event.button === 1 && sekmeKapat(this.dataset.a, event)" title="${esc(s.baslik)}">
      ${ik(s.ikon || "dosya")}<span>${esc(s.baslik)}</span>
      ${s.sabit ? "" : `<button class="kapat" title="Kapat" onclick="sekmeKapat(this.parentNode.dataset.a, event)">${ik("kapat")}</button>`}
    </div>`).join("");
}
function ciz() {
  sekmeleriCiz();
  const s = D.sekmeler.find(x => x.anahtar === D.aktif);
  const ana = $("#ana");
  ana.scrollTop = 0;
  if (!s) return;
  ({ev: anaSayfa, cihaz: cihazSayfasi, bolum: bolumSayfasi, galeri: galeriSayfasi, zaman: zamanSayfasi,
    istatistik: istatistikSayfasi, ara: aramaSayfasi, etiketler: etiketSayfasi, whatsapp: whatsappSayfasi, wasohbet: waSohbetSayfasi,
    rapor: raporSayfasi})[s.tur](ana, s);
}
const yukleniyor = (m = "Yükleniyor...") => `<div class="yukleniyor"><div class="donen"></div><div id="yuk-m">${esc(m)}</div></div>`;

// ======================================================================= ana sayfa (cihazlar)
async function anaSayfa(ana) {
  ana.innerHTML = yukleniyor();
  const j = await api("/api/cihazlar");
  D.cihazlar = j.cihazlar; D.kok = j.kok; D.surum = j.surum; D.web = j.web; D.yapimci = j.yapimci;
  D.portable = j.portable; D.rapor = j.rapor; D.ambx = j.ambx;
  ana.innerHTML = `<div class="sayfa">
    <div class="kirinti"><span class="ok">${ik("sag")}</span>Cihazlar
      <div class="sag">${D.portable ? "" : `<button class="dugme" onclick="yenileCihazlar()">${ik("yenile")} Yeniden tara</button>`}</div></div>
    ${D.portable ? `<div class="bilgi kok-satir" style="margin:0 0 14px"><span>Portable rapor: <b>${esc(D.kok)}</b> ·
      oluşturma ${esc((D.rapor.olusturma || "").replace("T", " "))} · ${esc(D.rapor.kapsam_adi || "")}
      (${sayi(D.rapor.dosya_adet)} dosya) · Ambar v${esc(D.rapor.ambar_surum || "")}</span>
      ${D.ambx ? `<span id="dogrula-durum" class="soluk" style="flex:none"></span><button class="dugme" id="dogrula">${ik("anahtar")} Bütünlüğü doğrula</button>` : ""}</div>`
    : `<div class="bilgi kok-satir" style="margin:0 0 14px"><span>Yedek klasörü: <b>${esc(D.kok)}</b> · ${D.cihazlar.length} cihaz,
      ${D.cihazlar.reduce((a, g) => a + g.cikarmalar.length, 0)} çıkarma</span>
      <button class="dugme" id="kok-degistir">${ik("dosya")} Klasörü değiştir...</button></div>`}
    ${D.cihazlar.length ? `<div class="cihaz-kartlari">${D.cihazlar.map(g => `
      <div class="cihaz-kart" onclick="cihazAc('${g.id}')">
        <div class="tel">${ik("tel")}</div>
        <div><h3>${esc(g.baslik)}</h3>
          <div class="alt">${esc([g.cihaz.marka, g.cihaz.model, g.cihaz.android && "Android " + g.cihaz.android].filter(Boolean).join(" · "))}</div>
          <div class="alt">Son çıkarma: ${esc((g.son_tarih || "").replace("T", " "))}</div>
          ${g.cikarmalar.map(c => `<span class="cip">${esc(c.tur_adi)}</span>`).join("")}
        </div></div>`).join("")}</div>`
    : `<div class="kart bos-durum">${ik("tel")}Bu klasörde Ambar yedeği bulunamadı.<br>Ambar ile yedek alın veya
       <code>ambar.py -o &lt;klasör&gt; incele</code> ile başka bir klasör açın.</div>`}
  </div>`;
  const dg = $("#dogrula");
  if (dg) dg.onclick = async () => {
    dg.disabled = true;
    await api("/api/dogrula", {});
    const z = setInterval(async () => {
      const d = await api("/api/dogrula_durum"), yaz = $("#dogrula-durum");
      if (!yaz) { clearInterval(z); return; }
      if (d.durum === "calisiyor") { yaz.textContent = `Doğrulanıyor... %${d.yuzde}`; return; }
      clearInterval(z); dg.disabled = false;
      if (d.durum === "hata") { yaz.innerHTML = `<b style="color:var(--kirmizi)">${esc(d.mesaj)}</b>`; return; }
      const ok = !d.hatali.length && d.tum_dosya !== false;
      yaz.innerHTML = ok ? `<b style="color:var(--yesil)">Doğrulandı: ${sayi(d.oge)} öğe${d.tum_dosya ? " ve .sha256 özeti" : ""} eşleşiyor</b>`
        : `<b style="color:var(--kirmizi)">UYUMSUZ: ${d.hatali.length} öğe${d.tum_dosya === false ? ", dosya özeti (.sha256) tutmuyor" : ""}</b>`;
    }, 600);
  };
  const kd = $("#kok-degistir");
  if (kd) kd.onclick = async () => {
    kd.disabled = true; kd.lastChild.textContent = " Klasör seçiliyor...";
    try {
      const j = await api("/api/klasor_sec", {baslangic: D.kok, baslik: "İncelenecek yedek klasörünü seçin"});
      if (j.yol) {
        const k = await api("/api/kok", {yol: j.yol});
        D.sekmeler = D.sekmeler.filter(x => x.sabit); D.aktif = "ev"; D.ozet = {};   // eski klasörün sekmeleri kapanır
        toast(`Yedek klasörü değişti: ${k.cihaz} cihaz bulundu`);
        ciz(); return;
      }
    } catch (e) { toast(e.message); }
    kd.disabled = false; kd.lastChild.textContent = " Klasörü değiştir...";
  };
  adrestenAc();
}
// Adres çubuğundan doğrudan açma: #c=<cihaz>&b=<bölüm>&p=<panel>
function adrestenAc() {
  if (D._adresAcildi) return; D._adresAcildi = true;
  const h = new URLSearchParams(location.hash.slice(1));
  const c = h.get("c") || (D.portable && D.cihazlar.length === 1 ? D.cihazlar[0].id : null);
  if (!c || !D.cihazlar.find(x => x.id === c)) return;
  cihazAc(c);
  if (h.get("p")) aktifSekme().panel = h.get("p");
  if (h.get("b")) bolumAc(c, h.get("b"));
  if (h.get("wa")) uygulamaAc(c, {paket: h.get("wa")});
}
async function yenileCihazlar() { await api("/api/cihazlar?yenile=1"); ciz(); }
function cihazAc(cid) {
  const g = D.cihazlar.find(x => x.id === cid);
  sekmeAc({anahtar: "c-" + cid, tur: "cihaz", cid, baslik: g.baslik, ikon: "tel", panel: "cihaz"});
}

      <div><div class="olay-baslik">Olay ve kanıt bilgileri <span class="soluk" id="olay-durum"></span></div>

        ${satir("Son çıkarma", (son.tarih || "").replace("T", " "))}${satir("Toplam veri", boyut(n.toplam_boyut))}

        ${satir("Android ID", d.android_id, kaynak)}${satir("Seri numarası", d.seri, kaynak)}

            + satir("· Numara", x.numara) + satir("· ICCID", x.iccid) + satir("· IMSI", x.imsi)).join("")}</table>`) : ""))
      + g.cikarmalar.filter(c => c !== k).map(c => cikarmaGrup(c, grup("Genel bilgi", `<table>${satir("Dahili isim", "Ambar " + c.tur_adi)}
        ${satir("Tarih", (c.tarih || "").replace("T", " "))}${satir("İşletim sistemi platformu", "Android İşletim Sistemi")}</table>`))).join("");
    p.innerHTML = `<div class="agac"><div>${sol}</div><div>${sag}</div></div>`;
  } else if (s.panel === "istatistik") {

    p.innerHTML = `<div class="ozet-izgara">${k.map(([a, v]) => `<div class="ozet-kutu"><b>${sayi(v)}</b><span>${a}</span></div>`).join("")}

// ======================================================================= bölüm açıcılar
const BOLUM_AD = {uygulamalar: ["Uygulamalar", "uygulama"], cagrilar: ["Çağrılar", "cagri"], dosyalar: ["Dosyalar", "dosya"],
  hesaplar: ["Hesaplar ve Şifreler", "anahtar"], kisiler: ["Kişiler", "kisi"], mesajlar: ["Mesajlar", "mesaj"], notlar: ["Notlar", "not"],
  sim_kartlari: ["SIM kartlar", "sim"], sim_rehberi: ["SIM rehberi", "kisi"], sim_dosyalari: ["SIM dosya sistemi", "cip"],
  rehber: ["Rehber", "kisi"], takvim: ["Takvim", "zaman"]};
function bolumAc(cid, ad, filtre = {}, baslikEk = "") {
  const g = D.cihazlar.find(x => x.id === cid);
  if (ad === "rapor") return raporAc(cid);
  if (ad === "galeri") return galeriAc(cid);
  if (["zaman", "istatistik", "ara", "etiketler"].includes(ad)) {
    const b = {zaman: ["Zaman çizelgesi", "zaman"], istatistik: ["İstatistik", "istatistik"], ara: ["Arama", "ara"], etiketler: ["Etiketli deliller", "etiket"]}[ad];
    return sekmeAc({anahtar: `${ad}-${cid}`, tur: ad, cid, baslik: `${b[0]} - ${g.baslik}`, ikon: b[1], q: filtre.q || "", guncelle: !!filtre.q});
  }
  const [b, ikon] = BOLUM_AD[ad];
  sekmeAc({anahtar: `${ad}-${cid}-${JSON.stringify(filtre)}`, tur: "bolum", ad, cid, baslik: `${b}${baslikEk} - ${g.baslik}`, ikon,
    filtre, q: "", sayfa: 1, sirala: "", yon: "", secili: null});
}
function galeriAc(cid, filtre = {}) {
  const g = D.cihazlar.find(x => x.id === cid);
  sekmeAc({anahtar: "galeri-" + cid + JSON.stringify(filtre), tur: "galeri", cid, baslik: "Fotoğraf ve video - " + g.baslik, ikon: "foto",
    kategori: filtre.kategori || "Görüntü", filtre, sayfa: 1, q: ""});
}
function uygulamaAc(cid, u) {
  if (u.ozel) return bolumAc(cid, u.ozel);
  if (u.paket.startsWith("com.whatsapp")) {
    const g = D.cihazlar.find(x => x.id === cid);
    return sekmeAc({anahtar: "wa-" + cid + u.paket, tur: "whatsapp", cid, paket: u.paket, baslik: uygulamaAdi(u.paket) + " - " + g.baslik, ikon: "mesaj"});
  }
  const f = {uygulama: u.paket}; if (u.hesap) f.hesap = u.hesap;
  bolumAc(cid, "dosyalar", f, " · " + u.ad);
}
const uygulamaAdi = p => p === "com.whatsapp.w4b" ? "WhatsApp Business" : "WhatsApp Messenger";
const simgeUrl = (cid, paket) => "/api/simge?" + qs({cihaz: cid, paket});
const harfRenk = p => `hsl(${[...(p || "?")].reduce((a, c) => a + c.charCodeAt(0), 0) % 360} 55% 48%)`;
// Uygulama adı + kendi simgesi (simge yoksa renkli baş harf)
const appAd = (cid, paket, ad) => `<div class="app-ad"><img loading="lazy" src="${simgeUrl(cid, paket)}"

      <div class="sih-satir" style="max-width:620px;margin-top:16px">
        <label class="alan">Tema rengi<input type="color" id="sh-r-renk" value="${esc(r.renk || "#1565c0")}"></label>
        <label class="alan">Sayfa yönü<select id="sh-r-yon"><option value="dikey">Dikey</option><option value="yatay" ${r.yon === "yatay" ? "selected" : ""}>Yatay</option></select></label></div>
      <div class="anahtarlar" style="margin-top:10px">
        ${anahtar("sh-r-yeni_sayfa", "Her bölüm yeni sayfada başlasın (PDF / yazdırma)", r.yeni_sayfa !== false)}
        ${anahtar("sh-r-program_bilgisi", "Raporun sonunda program adı ve sürümünü göster", r.program_bilgisi !== false)}</div>`,
    ustalt: `<h1>Üstbilgi ve altbilgi</h1><p class="ack">PDF'te ve yazdırmada her sayfanın üstünde/altında görünür (HTML'de sayfanın başında).</p>
      <div class="sih-form" style="max-width:720px">
        <label class="alan">Üstbilgi<input type="text" id="sh-r-ust_bilgi" value="${esc(r.ust_bilgi)}" placeholder="ör. GİZLİDİR - Yalnızca soruşturma amaçlı"></label>
        <label class="alan">Altbilgi<input type="text" id="sh-r-alt_bilgi" value="${esc(r.alt_bilgi)}" placeholder="ör. Kurum adı / adres"></label></div>

  };
  const p = document.createElement("div");

  const logoCiz = () => { q("#sh-logo-on").innerHTML = W.logo ? `<img src="${W.logo}" alt="">` : `<span class="soluk">Logo yok</span>`; };

  q("#sh-logo").onchange = e => {

      };
      img.src = okuyucu.result;

    catch (e) { toast(e.message); }
    finally { bt.disabled = false; q("#sh-durum").textContent = ""; }
  };

  q("#sh-x").onclick = q("#sh-iptal").onclick = kapat;
  q("#sh-onizle").onclick = async () => {
    const pen = window.open("about:blank", "_blank");

    catch (e) { pen && pen.close(); toast(e.message); }

  q("#sh-aktar").onclick = async () => {
    const v = topla();
    if (!v.bolumler.length) { toast("En az bir bölüm seçin"); return; }
    q("#sh-aktar").disabled = true;
    try { await api("/api/disa_aktar", v); }

    zaman = setInterval(async () => {
      const dd = await api("/api/disa_durum");
      q("#sh-bar").style.width = (dd.yuzde || 0) + "%";
      q("#sh-durum").textContent = dd.mesaj || "";
      if (dd.durum === "bitti") {
        clearInterval(zaman); zaman = null;
        q("#sh-durum").innerHTML = `<b style="color:var(--yesil)">Dışa aktarıldı:</b> ${esc(dd.yol)}`;
        const ac = q("#sh-aktar"); ac.disabled = false; ac.textContent = "Klasörü aç";
        ac.onclick = () => api("/api/klasor_ac", {});
        q("#sh-iptal").textContent = "Kapat";
      } else if (dd.durum === "hata") {
        clearInterval(zaman); zaman = null;
        q("#sh-durum").innerHTML = `<b style="color:var(--kirmizi)">Hata:</b> ${esc(dd.mesaj)}`;
        q("#sh-aktar").disabled = false;
      }
    }, 500);
  };
}

const FILTRE_SECENEK = {
  dosyalar: ["kategori", ["", "Görüntü", "Video", "Ses", "Belge", "Arşiv", "Uygulama", "Veritabanı", "Diğer"], "Tüm türler"],
  cagrilar: ["tur", ["", "Gelen", "Giden", "Cevapsız", "Reddedilen", "Engellenen", "Sesli mesaj"], "Tüm çağrılar"],
  mesajlar: ["kaynak", ["", "SMS", "MMS", "SIM SMS"], "Tüm mesajlar"],
};
function mesajGorunumSecici(s) {
  if (s.ad !== "mesajlar") return "";
  const b = (g, ikon, yazi) => `<button class="${s.gorunum === g ? "aktif" : ""}" onclick="mesajGorunum('${g}')">${ik(ikon)} ${yazi}</button>`;
  return `<div class="gorunum-sec" title="Görünüm">${b("tablo", "liste", "Tablo")}${b("gorusme", "mesaj", "Görüşmeler")}</div>`;
}
function mesajGorunum(g) {
  const s = aktifSekme();
  s.gorunum = g;
  try { localStorage.setItem("ambar_mesaj_gorunum", g); } catch (e) {}
  ciz();
}
async function bolumSayfasi(ana, s) {
  if (s.ad === "mesajlar") {
    if (!s.gorunum) { try { s.gorunum = localStorage.getItem("ambar_mesaj_gorunum"); } catch (e) {} s.gorunum = s.gorunum || "tablo"; }
    if (s.gorunum === "gorusme") return mesajGorusmeSayfasi(ana, s);
  }
  const fs = FILTRE_SECENEK[s.ad];
  const [b, ikon] = BOLUM_AD[s.ad];
  ana.innerHTML = `<div class="kart" style="margin:0;border-left:0;border-right:0">
    <div class="arac"><h2>${ik(ikon)}${esc(s.baslik.split(" - ")[0])} <span class="say" id="say"></span></h2>
      ${s.ad === "kisiler" ? `<span class="rozet" title="Telefon rehberi (Android Agent), SIM rehberi, çağrı ve mesaj kayıtları birleştirilir">Rehber + çağrı ve mesaj kayıtları</span>` : ""}
      <div class="bosluk"></div>
      ${mesajGorunumSecici(s)}
      ${fs ? `<select id="filtre">${fs[1].map(v => `<option value="${v}" ${(s.filtre[fs[0]] || "") === v ? "selected" : ""}>${v || fs[2]}</option>`).join("")}</select>` : ""}
      <label class="ara-kutu">${ik("ara")}<input id="ara" placeholder="Bu bölümde ara..." value="${esc(s.q)}"></label>
    </div>
    <div class="duzen" style="height:calc(100vh - 34px - 51px - 41px)">
      <div class="tablo-alan" id="tablo">${yukleniyor()}</div>
      <div class="ayrinti" id="ayrinti" style="display:none"></div>
    </div>
    <div class="sayfalama" id="sayfalama"></div></div>`;
  $("#ara").addEventListener("input", e => { clearTimeout(e.target._z); e.target._z = setTimeout(() => { s.q = e.target.value; s.sayfa = 1; tabloYukle(s); }, 300); });
  fs && $("#filtre").addEventListener("change", e => { s.filtre = {...s.filtre, [fs[0]]: e.target.value}; s.sayfa = 1; tabloYukle(s); });
  tabloYukle(s);
}
async function tabloYukle(s) {
  let j;
  try { j = await api("/api/bolum?" + qs({cihaz: s.cid, ad: s.ad, q: s.q, sayfa: s.sayfa, sirala: s.sirala, sira_yon: s.yon, ...s.filtre})); if (D.aktif !== s.anahtar || !$("#tablo")) return; }
  catch (e) { $("#tablo").innerHTML = `<div class="uyari">${esc(e.message)}</div>`; return; }
  s.veri = j;
  $("#say").textContent = sayi(j.toplam) + " kayıt";
  if (!j.toplam) { $("#tablo").innerHTML = `<div class="bos-durum">${ik(BOLUM_AD[s.ad][1])}Kayıt bulunamadı${s.ad === "cagrilar" || s.ad === "mesajlar" ? "<br>Çağrı ve mesajlar için yedeği 'Komple Yedek' veya 'Çağrı ve Mesaj Kayıtları' ile alın." : ""}</div>`; $("#sayfalama").innerHTML = ""; return; }
  const hucre = (k, r) => {
    const v = r[k.alan];
    switch (k.tur) {
      case "tarih": return `<td>${tarih(v)}</td>`;
      case "kurulum": return `<td>${esc(kurulum(v, k.alan))}</td>`;
      case "sure": return `<td>${sure(v)}</td>`;
      case "boyut": return `<td style="text-align:right">${boyut(v)}</td>`;
      case "sayi": return `<td style="text-align:right">${sayi(v)}</td>`;
      case "evet": return `<td>${v ? "Evet" : "Hayır"}</td>`;
      case "rozet": return `<td>${v ? `<span class="rozet ${esc(v)}">${esc(v)}</span>` : ""}</td>`;
      case "uzun": return `<td class="uzun"><div>${esc(v)}</div></td>`;
      case "yol": return `<td title="${esc(v)}" style="color:var(--soluk)">${esc(v)}</td>`;
      case "kisi": return `<td><div class="app-ad">${r.foto ? `<img loading="lazy" style="border-radius:50%" src="${dosyaUrl(s.cid, r.cikarma, r.foto)}">`
        : `<span class="harf" style="display:grid;border-radius:50%;background:${harfRenk(v)}">${esc(((v || "?")[0]).toUpperCase())}</span>`}<span>${esc(v)}</span></div></td>`;
      case "uygulama": return `<td>${appAd(s.cid, r.paket, v)}</td>`;
      case "dosya": return `<td><div class="dosya-ad">${RESIM.test(v) ? `<img loading="lazy" src="${dosyaUrl(s.cid, r.cikarma, r.yol)}">` : ""}${esc(v)}</div></td>`;
      default: return `<td title="${esc(v)}">${esc(v)}</td>`;
    }
  };
  $("#tablo").innerHTML = `<table class="veri"><thead><tr><th></th>${j.kolonlar.map(k => `<th onclick="sirala('${k.alan}')">${esc(k.baslik)}${s.sirala === k.alan ? `<span class="ok">${s.yon === "asc" ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead>
    <tbody>${j.satirlar.map((r, i) => `<tr data-i="${i}" class="${s.secili === r.id ? "secili" : ""}"><td class="yildiz">${r._etiket ? ik("yildiz") : ""}</td>${j.kolonlar.map(k => hucre(k, r)).join("")}</tr>`).join("")}</tbody></table>`;
  $("#tablo tbody").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) satirSec(s, j.satirlar[+tr.dataset.i], tr); });
  const sayfaSay = Math.ceil(j.toplam / j.boyut);
  $("#sayfalama").innerHTML = `<button class="dugme" ${j.sayfa <= 1 ? "disabled" : ""} onclick="sayfaGit(-1)">‹ Önceki</button>
    Sayfa ${j.sayfa} / ${sayfaSay} · ${sayi(j.toplam)} kayıt
    <button class="dugme" ${j.sayfa >= sayfaSay ? "disabled" : ""} onclick="sayfaGit(1)">Sonraki ›</button>`;
}
function aktifSekme() { return D.sekmeler.find(x => x.anahtar === D.aktif); }
function sirala(alan) { const s = aktifSekme(); s.yon = s.sirala === alan && s.yon !== "asc" ? "asc" : "desc"; s.sirala = alan; tabloYukle(s); }
function sayfaGit(d) { const s = aktifSekme(); s.sayfa += d; tabloYukle(s); $("#tablo").scrollTop = 0; }

function satirSec(s, r, tr) {
  s.secili = r.id;
  document.querySelectorAll("#tablo tr.secili").forEach(x => x.classList.remove("secili"));
  tr && tr.classList.add("secili");
  const a = $("#ayrinti");
  a.style.display = "block";
  const kol = s.veri.kolonlar;
  let onizleme = "";
  if (s.ad === "dosyalar") {
    const url = dosyaUrl(s.cid, r.cikarma, r.yol);
    onizleme = RESIM.test(r.ad) ? `<img src="${url}">` : VIDEO.test(r.ad) ? `<video src="${url}" controls></video>`
      : SES.test(r.ad) ? `<audio src="${url}" controls></audio>` : PDF.test(r.ad) ? `<iframe src="${url}"></iframe>`
      : METIN.test(r.ad) ? `<pre class="metin-on" id="metin-on">Yükleniyor...</pre>` : "";
    onizleme = `<div class="onizleme" id="onizleme">${onizleme}<div style="margin-top:8px"><a class="dugme" href="${dosyaUrl(s.cid, r.cikarma, r.yol, 1)}">${ik("indir")} Dışa aktar</a>
      <a class="dugme" href="${url}" target="_blank">Yeni sekmede aç</a></div></div>`;
    // dosya rapora dahil edilmemişse (portable) bunu açıkça söyle; metin dosyalarının ilk 256 KB'ını göster
    fetch(url, {headers: {Range: "bytes=0-262143"}}).then(async yan => {
      if (yan.status === 404) { const o = $("#onizleme"); if (o) o.innerHTML = `<div class="soluk">Bu dosya rapora dahil edilmedi; yalnızca bilgileri görüntülenebilir.</div>`; return; }
      const m = $("#metin-on"); if (!m) return;
      const tampon = await yan.arrayBuffer();
      let t = new TextDecoder("utf-8").decode(tampon);
      if (/�/.test(t.slice(0, 2000))) t = new TextDecoder("windows-1254").decode(tampon);
      m.textContent = t + (tampon.byteLength >= 262144 ? "\n\n… (ilk 256 KB gösteriliyor)" : "");
    }).catch(() => {});
  }
  const baslik = r.ad || r.isim || r.numara || r.paket || (r.metin || "").slice(0, 40) || "Kayıt";
  a.innerHTML = `<div class="ust-b">${ik(BOLUM_AD[s.ad][1])}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(baslik)}</span>
      <button class="kapat dugme" style="height:26px;padding:0 6px" onclick="$('#ayrinti').style.display='none'">${ik("kapat")}</button></div>
    ${onizleme}
    <dl>${kol.map(k => { let v = r[k.alan]; if (v == null || v === "") return "";
        v = k.tur === "tarih" ? tarih(v) : k.tur === "kurulum" ? kurulum(v, k.alan) : k.tur === "sure" ? sure(v) + ` (${v} sn)` : k.tur === "boyut" ? `${boyut(v)} (${sayi(v)} bayt)` : k.tur === "evet" ? (v ? "Evet" : "Hayır") : v;
        return `<dt>${esc(k.baslik)}</dt><dd>${esc(v)}</dd>`; }).join("")}</dl>
    ${s.ad === "kisiler" ? `<div class="etiket-alan"><button class="dugme" onclick="bolumAc('${s.cid}','cagrilar',{anahtar:'${r.id}'},' · ${esc(r.isim || r.numara)}')">${ik("cagri")} Çağrıları</button>
      <button class="dugme" onclick="bolumAc('${s.cid}','mesajlar',{anahtar:'${r.id}'},' · ${esc(r.isim || r.numara)}')">${ik("mesaj")} Mesajları</button></div>` : ""}
    ${s.ad === "mesajlar" ? `<div class="etiket-alan"><button class="dugme" onclick="gorusmedeAc(${esc(JSON.stringify(String(r.anahtar)))}, ${r.id})">${ik("mesaj")} Görüşmede göster</button></div>` : ""}
    <div class="etiket-alan">
      <textarea id="etiket-not" placeholder="Delil açıklaması (isteğe bağlı)"></textarea>
      <button class="dugme ${r._etiket ? "" : "ana"}" onclick="etiketle('${s.ad}', ${esc(JSON.stringify(String(r.id)))}, ${esc(JSON.stringify(String(baslik)))}, ${r._etiket ? 1 : 0})">
        ${ik("yildiz")} ${r._etiket ? "Etiketi kaldır" : "Delil olarak etiketle"}</button></div>`;
}
async function etiketle(tur, ref, baslik, sil) {
  const s = aktifSekme();
  await api("/api/etiket", {cihaz: s.cid, tur, ref, baslik, aciklama: ($("#etiket-not") || {}).value, sil: !!sil});
  toast(sil ? "Etiket kaldırıldı" : "Delil olarak etiketlendi");
  if (D.ozet[s.cid]) D.ozet[s.cid].sayilar.etiketler += sil ? -1 : 1;
  if (s.tur === "bolum") { await tabloYukle(s); const r = s.veri.satirlar.find(x => String(x.id) === ref); r && satirSec(s, r, $(`#tablo tr.secili`)); }
  else if (s.tur === "galeri") galeriYukle(s, true);
}

// ======================================================================= galeri
async function galeriSayfasi(ana, s) {
  ana.innerHTML = `<div class="arac" style="background:#fff">
    <h2>${ik("foto")}Fotoğraf ve video <span class="say" id="say"></span></h2><div class="bosluk"></div>
    <select id="g-kat"><option value="Görüntü">Fotoğraflar</option><option value="Video" ${s.kategori === "Video" ? "selected" : ""}>Videolar</option></select>
    <label class="ara-kutu">${ik("ara")}<input id="ara" placeholder="Dosya adı veya klasör..." value="${esc(s.q)}"></label></div>
    <div id="galeri" class="galeri">${yukleniyor()}</div><div class="sayfalama" id="sayfalama"></div>`;
  $("#g-kat").onchange = e => { s.kategori = e.target.value; s.sayfa = 1; galeriYukle(s); };
  $("#ara").addEventListener("input", e => { clearTimeout(e.target._z); e.target._z = setTimeout(() => { s.q = e.target.value; s.sayfa = 1; galeriYukle(s); }, 300); });
  galeriYukle(s);
}
async function galeriYukle(s, sessiz) {
  const j = await api("/api/bolum?" + qs({cihaz: s.cid, ad: "dosyalar", kategori: s.kategori, q: s.q, sayfa: s.sayfa, boyut: 120, ...s.filtre}));
  if (D.aktif !== s.anahtar || !$("#galeri")) return;
  s.veri = j;
  $("#say").textContent = sayi(j.toplam);
  $("#galeri").innerHTML = j.satirlar.map((r, i) => `<div class="oge" onclick="isikAc(${i})">
      ${r.kategori === "Video" ? `<video preload="metadata" src="${dosyaUrl(s.cid, r.cikarma, r.yol)}#t=0.5" muted style="width:100%;height:100%;object-fit:cover"></video><div class="vid">${ik("oynat")}</div>`
        : `<img loading="lazy" src="${dosyaUrl(s.cid, r.cikarma, r.yol)}" alt="">`}
      ${r._etiket ? `<span class="yildiz">${ik("yildiz")}</span>` : ""}<div class="alt-yazi">${tarih(r.mtime, false)}</div></div>`).join("")
    || `<div class="bos-durum" style="grid-column:1/-1">${ik("foto")}Kayıt yok</div>`;
  const ss = Math.ceil(j.toplam / j.boyut) || 1;
  $("#sayfalama").innerHTML = `<button class="dugme" ${s.sayfa <= 1 ? "disabled" : ""} onclick="galeriSayfa(-1)">‹ Önceki</button>
    Sayfa ${s.sayfa} / ${ss}<button class="dugme" ${s.sayfa >= ss ? "disabled" : ""} onclick="galeriSayfa(1)">Sonraki ›</button>`;
  if (!sessiz) $("#ana").scrollTop = 0;
  if (s.isik != null) isikAc(s.isik);
}
function galeriSayfa(d) { const s = aktifSekme(); s.sayfa += d; galeriYukle(s); }
function isikAc(i) {
  const s = aktifSekme(), r = s.veri.satirlar[i];
  if (!r) return;
  s.isik = i;
  const url = dosyaUrl(s.cid, r.cikarma, r.yol);
  let el = $("#isik");
  if (!el) { el = document.createElement("div"); el.id = "isik"; el.className = "isik"; document.body.appendChild(el); }
  el.innerHTML = `<div class="resim">${r.kategori === "Video" ? `<video src="${url}" controls autoplay></video>` : `<img src="${url}">`}</div>
    <button class="kapat-b" onclick="isikKapat()">${ik("kapat")} Kapat (Esc)</button>
    ${i > 0 ? `<button class="gez" style="left:14px" onclick="isikAc(${i - 1})">‹</button>` : ""}
    ${i < s.veri.satirlar.length - 1 ? `<button class="gez" style="right:374px" onclick="isikAc(${i + 1})">›</button>` : ""}
    <div class="yan"><div class="ust-b" style="padding:12px 14px;font-weight:600;border-bottom:1px solid var(--kenar2)">${esc(r.ad)}</div>
      <dl style="margin:0;padding:10px 14px;display:grid;grid-template-columns:100px 1fr;gap:6px 10px">
        <dt style="color:var(--soluk)">Değiştirme</dt><dd style="margin:0">${tarih(r.mtime)}</dd>
        <dt style="color:var(--soluk)">Boyut</dt><dd style="margin:0">${boyut(r.boyut)}</dd>
        <dt style="color:var(--soluk)">Uygulama</dt><dd style="margin:0">${esc(r.uygulama || "-")}</dd>
        <dt style="color:var(--soluk)">Yol</dt><dd style="margin:0;word-break:break-all">${esc(r.yol)}</dd></dl>
      <div class="etiket-alan"><textarea id="etiket-not" placeholder="Delil açıklaması (isteğe bağlı)"></textarea>
        <button class="dugme ${r._etiket ? "" : "ana"}" onclick="etiketle('dosyalar', '${r.id}', ${esc(JSON.stringify(r.ad))}, ${r._etiket ? 1 : 0})">${ik("yildiz")} ${r._etiket ? "Etiketi kaldır" : "Delil olarak etiketle"}</button>
        <a class="dugme" href="${dosyaUrl(s.cid, r.cikarma, r.yol, 1)}">${ik("indir")} Dışa aktar</a></div></div>`;
}
function isikKapat() { const s = aktifSekme(); s && (s.isik = null); $("#isik") && $("#isik").remove(); }
document.addEventListener("keydown", e => {
  if (!$("#isik")) return;
  const s = aktifSekme();
  if (e.key === "Escape") isikKapat();
  if (e.key === "ArrowRight") isikAc(s.isik + 1);
  if (e.key === "ArrowLeft") isikAc(s.isik - 1);
});

// ======================================================================= zaman çizelgesi
async function zamanSayfasi(ana, s) {
  s.turler = s.turler || ["cagri", "mesaj", "not", "medya"];
  s.sayfa = s.sayfa || 1;
  ana.innerHTML = `<div class="arac" style="background:#fff;position:sticky;top:0;z-index:2">
    <h2>${ik("zaman")}Zaman çizelgesi <span class="say" id="say"></span></h2>
    <div class="secenekler">${[["cagri", "Çağrılar"], ["mesaj", "Mesajlar"], ["not", "Notlar"], ["medya", "Fotoğraf/video"]].map(([k, b]) =>
      `<label><input type="checkbox" value="${k}" ${s.turler.includes(k) ? "checked" : ""}> ${b}</label>`).join("")}</div>
    <div class="bosluk"></div>
    <input type="date" id="bas" class="dugme" title="Başlangıç"> <input type="date" id="bit" class="dugme" title="Bitiş">
    <label class="ara-kutu">${ik("ara")}<input id="ara" placeholder="Kişi, numara veya metin..." value="${esc(s.q || "")}"></label></div>
    <div class="zaman" id="zaman">${yukleniyor()}</div><div class="sayfalama" id="sayfalama"></div>`;
  ana.querySelectorAll(".secenekler input").forEach(c => c.onchange = () => { s.turler = [...ana.querySelectorAll(".secenekler input:checked")].map(x => x.value); s.sayfa = 1; zamanYukle(s); });
  $("#ara").addEventListener("input", e => { clearTimeout(e.target._z); e.target._z = setTimeout(() => { s.q = e.target.value; s.sayfa = 1; zamanYukle(s); }, 300); });
  ["bas", "bit"].forEach(k => $("#" + k).onchange = e => { s[k] = e.target.value ? new Date(e.target.value + (k === "bit" ? "T23:59:59" : "T00:00:00")).getTime() : ""; s.sayfa = 1; zamanYukle(s); });
  zamanYukle(s);
}
async function zamanYukle(s) {
  const j = await api("/api/zaman?" + qs({cihaz: s.cid, turler: s.turler.join(","), q: s.q, bas: s.bas, bit: s.bit, sayfa: s.sayfa}));
  if (D.aktif !== s.anahtar || !$("#zaman")) return;
  $("#say").textContent = sayi(j.toplam) + " olay";
  let son = "", h = "";
  const IKN = {cagri: "cagri", mesaj: "mesaj", not: "not", medya: "foto"};
  for (const o of j.olaylar) {
    const g = new Date(+o.tarih).toDateString();
    if (g !== son) { h += `<div class="gun">${esc(gunAdi(o.tarih))}</div>`; son = g; }
    const resim = o.tur === "medya" && RESIM.test(o.ek || "") ? `<img loading="lazy" src="${dosyaUrl(s.cid, o.cikarma, o.yol)}">` : "";
    const ek = o.tur === "cagri" ? "Süre " + sure(o.ek) : o.ek;
    h += `<div class="olay" onclick='zamanOlay(${JSON.stringify({tur: o.tur, kim: o.kim || ""})})'>
      <div class="saat">${tarih(o.tarih).slice(11, 16)}</div><div class="tikon ${o.tur}">${ik(IKN[o.tur])}</div>
      <div class="ic"><div class="b">${esc(o.baslik)}${o.kim ? " · " + esc(o.kim) : ""}</div><div class="m">${esc(ek || "")}</div></div>${resim}</div>`;
  }
  $("#zaman").innerHTML = h || `<div class="bos-durum">${ik("zaman")}Olay yok</div>`;
  const ss = Math.ceil(j.toplam / 200) || 1;
  $("#sayfalama").innerHTML = `<button class="dugme" ${s.sayfa <= 1 ? "disabled" : ""} onclick="zamanSayfa(-1)">‹ Daha yeni</button>
    Sayfa ${s.sayfa} / ${ss}<button class="dugme" ${s.sayfa >= ss ? "disabled" : ""} onclick="zamanSayfa(1)">Daha eski ›</button>`;
}
function zamanSayfa(d) { const s = aktifSekme(); s.sayfa += d; zamanYukle(s); $("#ana").scrollTop = 0; }
function zamanOlay(o) {
  const s = aktifSekme();
  if (o.tur === "cagri") bolumAc(s.cid, "cagrilar"); else if (o.tur === "mesaj") bolumAc(s.cid, "mesajlar");
  else if (o.tur === "not") bolumAc(s.cid, "notlar"); else galeriAc(s.cid);
  const y = aktifSekme(); if (o.kim && y.tur === "bolum") { y.q = o.kim; ciz(); }
}

// ======================================================================= istatistik
async function istatistikSayfasi(ana, s) {
  ana.innerHTML = yukleniyor();
  const j = await api("/api/istatistik?cihaz=" + s.cid);
  if (D.aktif !== s.anahtar) return;
  const cubuk = (liste, alan, fmt = sayi, ad = r => r.ad) => {
    const max = Math.max(1, ...liste.map(r => +r[alan] || 0));
    return liste.map(r => `<div class="cubuk"><div class="ad" title="${esc(ad(r))}">${esc(ad(r) || "-")}</div><div class="bar"><i style="width:${(+r[alan] || 0) / max * 100}%"></i></div><div class="deger">${fmt(r[alan])}</div></div>`).join("")
      || `<div style="color:var(--soluk)">Veri yok</div>`;
  };
  const aylik = [...j.aylik].reverse(), maxA = Math.max(1, ...aylik.map(r => r.cagri + r.mesaj));
  const saat = Array.from({length: 24}, (_, h) => (j.saatlik.find(x => x.saat === h) || {adet: 0}).adet), maxS = Math.max(1, ...saat);
  ana.innerHTML = `<div class="arac" style="background:#fff"><h2>${ik("istatistik")}İstatistik</h2></div><div class="grafikler">
    <div class="grafik"><h3>Dosya türleri (boyut)</h3>${cubuk(j.kategoriler, "boyut", boyut)}</div>
    <div class="grafik"><h3>En çok yer kaplayan uygulamalar</h3>${cubuk(j.uygulama_boyut, "boyut", boyut)}</div>
    <div class="grafik"><h3>En çok iletişim kurulan kişiler</h3>${cubuk(j.en_cok, "toplam", sayi, r => r.isim || r.numara)}</div>
    <div class="grafik"><h3>Çağrı türleri</h3>${cubuk(j.cagri_tur, "adet")}</div>
    <div class="grafik"><h3>Mesajlar</h3>${cubuk(j.mesaj_yon, "adet")}</div>
    <div class="grafik"><h3>Aylık iletişim <span style="font-weight:400;color:var(--soluk);font-size:12px">■ çağrı <span style="color:#8b5cf6">■</span> mesaj</span></h3>
      <div class="sutunlar">${aylik.map(r => `<div class="s" title="${r.ay}: ${r.cagri} çağrı, ${r.mesaj} mesaj">
        <i class="m" style="height:${r.mesaj / maxA * 100}%"></i><i style="height:${r.cagri / maxA * 100}%;margin-top:-3px"></i>${r.ay.slice(2)}</div>`).join("") || "Veri yok"}</div></div>
    <div class="grafik"><h3>Günün saatlerine göre iletişim</h3><div class="sutunlar">${saat.map((v, h) => `<div class="s" title="${h}:00 - ${v}"><i style="height:${v / maxS * 100}%"></i>${h}</div>`).join("")}</div></div>
  </div>`;
}

// ======================================================================= arama
async function aramaSayfasi(ana, s) {
  ana.innerHTML = `<div class="arac" style="background:#fff"><h2>${ik("ara")}Arama</h2>
    <label class="ara-kutu" style="flex:1;max-width:600px">${ik("ara")}<input id="genel-ara" placeholder="Numara, isim, mesaj metni, dosya adı, not..." value="${esc(s.q || "")}" autofocus></label></div>
    <div id="sonuc" style="padding:4px 0"></div>`;
  const yap = async () => {
    const q = $("#genel-ara").value.trim(); s.q = q;
    if (q.length < 2) { $("#sonuc").innerHTML = `<div class="bos-durum">${ik("ara")}En az 2 karakter yazın. Tüm bölümlerde aranır.</div>`; return; }
    $("#sonuc").innerHTML = yukleniyor();
    const j = await api("/api/ara?" + qs({cihaz: s.cid, q}));
    const anahtarlar = Object.keys(j);
    $("#sonuc").innerHTML = anahtarlar.length ? anahtarlar.map(ad => {
      const v = j[ad], [b, ikon] = BOLUM_AD[ad];
      return `<div class="kart" style="margin:12px 14px"><div class="arac"><h2>${ik(ikon)}${b} <span class="say">${sayi(v.toplam)} sonuç</span></h2><div class="bosluk"></div>
        <button class="dugme" onclick='aramaBolum("${ad}")'>Tümünü göster</button></div>

        <span class="kyn">${esc(m.kaynak)}</span><span title="${tarih(m.tarih)}">${m.tarih ? waSaat(m.tarih) : ""}</span></div></div>`;
  };
  alan.innerHTML = `<div class="wa-sohbet-ust"><div class="wa-av harf" style="background:${id === "_" ? "#9aa3af" : harfRenk(id)}">${esc((ad.replace(/^\+/, "")[0] || "?").toUpperCase())}</div>
      <div style="flex:1;min-width:0"><b>${esc(ad)}</b><div class="soluk" style="font-size:12px">${esc(j.numara && j.numara !== ad ? j.numara + " · " : "")}${sayi(j.toplam)} mesaj</div></div>
      <button class="dugme" title="Bu kişinin mesajlarını tablo olarak göster" onclick="gorusmeTablo('${s.cid}', ${esc(JSON.stringify(String(id)))}, ${esc(JSON.stringify(ad))})">${ik("liste")} Tabloda aç</button></div>
    <div class="wa-akis" id="wa-akis">
      ${j.sayfa > 1 ? `<div style="text-align:center;margin:6px"><button class="dugme" onclick="gorusmeYukle(aktifSekme(), ${j.sayfa - 1})">Daha eski mesajlar (${j.sayfa - 1}/${j.son_sayfa})</button></div>` : ""}
      ${j.mesajlar.map(balon).join("")}
      ${j.sayfa < j.son_sayfa ? `<div style="text-align:center;margin:6px"><button class="dugme" onclick="gorusmeYukle(aktifSekme(), ${j.sayfa + 1})">Daha yeni mesajlar</button></div>` : ""}</div>`;
  const akis = $("#wa-akis");
  const h = hedef && akis.querySelector(`[data-m="${hedef}"]`);
  if (h) h.scrollIntoView({block: "center"});
  else akis.scrollTop = sayfa && sayfa < j.son_sayfa ? 0 : akis.scrollHeight;
  s.hedefMesaj = null;
}
function gorusmeTablo(cid, anahtar, ad) {
  aktifSekme().gorunum = "tablo";
  try { localStorage.setItem("ambar_mesaj_gorunum", "tablo"); } catch (e) {}
  bolumAc(cid, "mesajlar", {anahtar}, " · " + ad);
  aktifSekme().gorunum = "tablo";
  ciz();
}
